# Compilación estática y despliegue en GitHub Pages (especificación §16.1).
#
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_SITE_URL   URL pública sin barra final. La ruta base se deriva de ella.
#   PERMITIR_PENDIENTES    "true" durante las Fases 1–6; se elimina en la Fase 7 (§14.4).
#   Resto de NEXT_PUBLIC_* según .env.example.
# Secretos:
#   FONTS_REPO_TOKEN       Token de solo lectura del repositorio privado de fuentes (§9.4).
#                          Sin él, la compilación usa el respaldo tipográfico.

name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [contenido-actualizado]
  workflow_dispatch:
  # La compilación programada para publicaciones con fecha futura se añade en la Fase 5.

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    # Varias ediciones seguidas producen una sola compilación final (§3.5).
    concurrency:
      group: pages-compilar
      cancel-in-progress: true
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
      NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT: ${{ vars.NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT || 'true' }}
      NEXT_PUBLIC_WHATSAPP: ${{ vars.NEXT_PUBLIC_WHATSAPP }}
      NEXT_PUBLIC_EQUIPO_ACTIVO: ${{ vars.NEXT_PUBLIC_EQUIPO_ACTIVO || 'true' }}
      PERMITIR_PENDIENTES: ${{ vars.PERMITIR_PENDIENTES }}
      TIENE_FUENTES: ${{ secrets.FONTS_REPO_TOKEN != '' }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Configurar URL y ruta base
        env:
          URL_CONFIGURADA: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          url="${URL_CONFIGURADA:-https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}}"
          url="${url%/}"
          ruta="$(node -e 'console.log(new URL(process.argv[1]).pathname.replace(/\/$/, ""))' "$url")"
          echo "NEXT_PUBLIC_SITE_URL=$url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=$ruta" >> "$GITHUB_ENV"
          echo "Sitio: $url  ·  Ruta base: ${ruta:-(ninguna)}"

      - name: Obtener las fuentes Breve del repositorio privado
        if: env.TIENE_FUENTES == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/rb-fuentes-privadas
          token: ${{ secrets.FONTS_REPO_TOKEN }}
          path: _fuentes

      - name: Copiar las fuentes Breve
        if: env.TIENE_FUENTES == 'true'
        run: |
          mkdir -p src/fonts/breve
          find _fuentes -name '*.woff2' -exec cp {} src/fonts/breve/ \;
          rm -rf _fuentes
          ls src/fonts/breve

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node LTS
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Incluye optimización de imágenes y verificación de pendientes (scripts/preparar.mjs).
      - name: Compilar
        run: pnpm build

      - name: Preparar el artefacto
        run: touch out/.nojekyll

      - name: Subir el artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  desplegar:
    needs: compilar
    runs-on: ubuntu-latest
    # Un despliegue en curso nunca se cancela: dejaría Pages en estado inconsistente.
    concurrency:
      group: pages-desplegar
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
